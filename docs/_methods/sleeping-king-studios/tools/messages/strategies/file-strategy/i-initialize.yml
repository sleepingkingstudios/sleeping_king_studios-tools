---
name: SleepingKingStudios::Tools::Messages::Strategies::FileStrategy#initialize
parent_path: sleeping-king-studios/tools/messages/strategies/file-strategy
signature: 'initialize(file_name, flatten_templates: true, validate_values: true)'
slug: initialize
constructor: true
data_path: sleeping-king-studios/tools/messages/strategies/file-strategy/i-initialize
overloads:
- name: SleepingKingStudios::Tools::Messages::Strategies::FileStrategy#initialize
  parent_path: sleeping-king-studios/tools/messages/strategies/file-strategy
  signature: initialize(file_name, **options)
  slug: initialize
  constructor: true
  options:
  - name: options
    opts:
    - description: |-
        if true, the templates
        are flattened internally. Defaults to true.
      name: flatten_templates
      type:
      - name: 'true'
      - name: 'false'
    - description: |-
        if false, skips
        validation of template values. If given a Proc, calls the Proc with
        each template value; the value fails validation if the Proc returns
        an error message. Defaults to true.
      name: validate_values
      type:
      - name: Proc
      - name: 'true'
      - name: 'false'
  params:
  - description: |-
      the full path to the file with the templates
      data.
    name: file_name
    type:
    - name: String
  - description: additional options for the strategy.
    name: options
    type:
    - name: Hash
returns:
- description: a new instance of FileStrategy
  type:
  - name: FileStrategy
version: "*"
