    provided.
  params:
  - description: the key used to resolve the message.
    name: key
    type:
    - name: String
    - name: Symbol
  - description: |-
      the default value to return if the strategy does
      not define a message for the key.
    name: default
    type:
    - name: Object
    default: nil
  - description: |-
      the namespace for the key. Combined with the given
      key to generate the scoped key value.
    name: scope
    type:
    - name: String
    default: nil
  - description: |-
      additional options for resolving or generating the
      message.
    name: options
    type:
    - name: Hash
  returns:
  - description: |-
      the stored template for the requested key, or the
      provided default value.
    type:
    - name: Object
  short_description: Retrieves the messages template with the given scope and options.
- name: SleepingKingStudios::Tools::Messages::Strategy#fetch
  parent_path: sleeping-king-studios/tools/messages/strategy
  signature: 'fetch(key, scope: nil, **options, &default)'
