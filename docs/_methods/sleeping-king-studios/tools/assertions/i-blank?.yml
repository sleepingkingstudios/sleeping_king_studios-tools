---
name: SleepingKingStudios::Tools::Assertions#blank?
parent_path: sleeping-king-studios/tools/assertions
signature: blank?(value)
slug: blank?
constructor: false
data_path: sleeping-king-studios/tools/assertions/i-blank?
description: |-
  A value is blank if it is nil, or if the value responds to #empty? and the
  #empty? method returns true.
metadata:
  examples:
  - name: ''
    text: |-
      assertions.blank?(nil)
      #=> true

      assertions.blank?(Object.new)
      #=> false

      assertions.blank?([])
      #=> true

      assertions.blank?([1, 2, 3])
      #=> false
params:
- description: the value to assert on.
  name: value
  type:
  - name: Object
returns:
- description: |-
    true if the value is nil or empty, otherwise returns
    false.
  type:
  - name: 'true'
  - name: 'false'
short_description: Checks if the value is either nil or empty.
