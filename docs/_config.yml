---
plugins:
  - sleeping_king_studios/docs/jekyll/plugins/required
collections:
  classes:
    output: false
  constants:
    output: false
  methods:
    output: false
  modules:
    output: false
  namespaces:
    output: false
  versions:
    output: false
defaults:
- scope:
    path: ''
    type: 'pages'
  values:
    encoding: 'utf-8'
    layout: 'page'
    title: 'SleepingKingStudios::Tools'
exclude:
  - /vendor
markdown: kramdown

# Project Configuration
project_metadata:
  description:    A library of utility services and concerns.
  name:           SleepingKingStudios::Tools
  repository_url: https://github.com/sleepingkingstudios/sleeping_king_studios-tools

# Theme Configuration
theme: jekyll-theme-dinky
description: |
  A library of utility services and concerns.
github:
  repository_url: https://github.com/sleepingkingstudios/sleeping_king_studios-tools
title: 'Tools'
